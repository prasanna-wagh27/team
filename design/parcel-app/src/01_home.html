<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Parcel app · Home</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="screen">

  <div class="sb">
    <span>9:41</span>
    <span class="sbr">
      <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 11.5 5.6 9a3.4 3.4 0 0 1 4.8 0Z"/><path d="M3.4 6.8a6.5 6.5 0 0 1 9.2 0l-1.4 1.4a4.5 4.5 0 0 0-6.4 0Z"/><path d="M1.2 4.6a9.6 9.6 0 0 1 13.6 0l-1.4 1.4a7.6 7.6 0 0 0-10.8 0Z"/></svg>
      <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".4"/><rect x="2.5" y="2.5" width="17" height="8" rx="2"/><path d="M25 4.5v4a2 2 0 0 0 0-4Z" opacity=".4"/></svg>
    </span>
  </div>
  <div class="island"></div>

  <!-- top bar -->
  <div class="top">
    <div class="av">RK</div>
    <div class="where">
      <span class="label">Pickup city</span>
      <b>Mumbai <svg class="i"><use href="#down"/></svg></b>
    </div>
    <div class="ibtn"><svg class="i"><use href="#bell"/></svg><span class="dot"></span></div>
  </div>

  <!-- mode -->
  <div class="seg">
    <div class="on"><svg class="i"><use href="#box"/></svg>Send</div>
    <div><svg class="i"><use href="#car"/></svg>Carry</div>
  </div>

  <h1>Where is your parcel going?</h1>

  <!-- route form -->
  <div class="form">
    <div class="card">
      <div class="f">
        <span class="mk a"></span>
        <div class="v"><span class="label">From</span><b>Andheri West, Mumbai</b></div>
      </div>
      <div class="f">
        <span class="mk b"></span>
        <div class="v"><span class="label">To</span><b>Kothrud, Pune</b></div>
        <div class="ibtn sw"><svg class="i" style="width:18px;height:18px"><use href="#swap"/></svg></div>
      </div>
      <div class="f split">
        <div><span class="mk"><svg class="i"><use href="#cal"/></svg></span><div class="v"><span class="label">Date</span><b>Today</b></div></div>
        <div><span class="mk"><svg class="i"><use href="#box"/></svg></span><div class="v"><span class="label">Size</span><b>Small, 5 kg</b></div></div>
      </div>
      <span class="rail"></span>
    </div>
    <div class="btn">Find carriers <svg class="i"><use href="#arrow"/></svg></div>
  </div>

  <!-- live parcel -->
  <div class="sec"><h2>On the way</h2><a>All parcels</a></div>
  <div class="live card">
    <div class="map">
      <svg viewBox="0 14 358 104" preserveAspectRatio="xMidYMid slice">
        <rect width="358" height="118" fill="#ECEEF1"/>
        <path d="M0 0h46c-6 20 4 40-6 62s-8 40-2 56H0Z" fill="#DCE6F0"/>
        <rect x="214" y="70" width="70" height="34" rx="6" fill="#DFEDE3"/>
        <rect x="96" y="10" width="44" height="28" rx="5" fill="#DFEDE3"/>
        <g stroke="#fff" stroke-linecap="round" fill="none">
          <path d="M60 0v118M120 0v118M190 0v118M262 0v118M326 0v118" stroke-width="5"/>
          <path d="M46 30h312M46 64h312M46 96h312" stroke-width="5"/>
          <path d="M50 118 C120 92 150 60 210 48 S300 26 358 10" stroke-width="11"/>
        </g>
        <path d="M50 118 C120 92 150 60 210 48 S300 26 358 10" stroke="#DADDE3" stroke-width="1" fill="none"/>
        <path d="M74 110 C120 92 150 62 196 51" stroke="#FF5A1F" stroke-width="4" fill="none" stroke-linecap="round"/>
        <path d="M196 51 C240 42 270 34 304 26" stroke="#121317" stroke-width="2.5" stroke-dasharray="1 6" fill="none" stroke-linecap="round"/>
        <circle cx="74" cy="110" r="5" fill="#fff" stroke="#121317" stroke-width="3"/>
        <rect x="298" y="19" width="13" height="13" rx="3" fill="#121317"/>
      </svg>
      <div style="position:absolute;left:180px;top:21px;width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 4px rgba(255,90,31,.25)"><svg class="i" style="width:16px;height:16px;stroke-width:2.1"><use href="#car"/></svg></div>
    </div>
    <div class="body">
      <div class="row">
        <div>
          <h3>Mumbai <svg class="i"><use href="#arrow"/></svg> Pune</h3>
          <p>Reaches Kothrud by <b>6:40 pm</b></p>
        </div>
        <span class="state"><i></i>In transit</span>
      </div>
      <div class="who">
        <div class="av light">AS</div>
        <div class="n"><b>Amit Shinde <svg class="vf"><use href="#verified"/></svg></b><span>Swift Dzire · 4.9 rating</span></div>
        <div class="ibtn"><svg class="i"><use href="#chat"/></svg></div>
        <div class="ibtn"><svg class="i"><use href="#phone"/></svg></div>
      </div>
    </div>
  </div>

  <!-- tab bar -->
  <div class="tabbar">
    <div class="t on"><svg class="i"><use href="#home"/></svg>Home</div>
    <div class="t"><svg class="i"><use href="#list"/></svg>Parcels</div>
    <div class="t"><span class="ib"><svg class="i"><use href="#chat"/></svg><em>2</em></span>Inbox</div>
    <div class="t"><svg class="i"><use href="#user"/></svg>Profile</div>
    <div class="homebar"></div>
  </div>
</div>

<svg width="0" height="0" style="position:absolute"><defs>
  <symbol id="bell" viewBox="0 0 24 24"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></symbol>
  <symbol id="down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
  <symbol id="box" viewBox="0 0 24 24"><path d="M21 8 12 3 3 8v8l9 5 9-5Z"/><path d="m3 8 9 5 9-5"/><path d="M12 13v8"/><path d="m7.5 5.5 9 5"/></symbol>
  <symbol id="car" viewBox="0 0 24 24"><path d="M19 17h2v-4l-2.2-5.2A2 2 0 0 0 17 6.6H7a2 2 0 0 0-1.8 1.2L3 13v4h2"/><circle cx="7.5" cy="17" r="2"/><circle cx="16.5" cy="17" r="2"/><path d="M9.5 17h5"/><path d="M3 13h18"/></symbol>
  <symbol id="swap" viewBox="0 0 24 24"><path d="M7 4v16"/><path d="m3 8 4-4 4 4"/><path d="M17 20V4"/><path d="m21 16-4 4-4-4"/></symbol>
  <symbol id="cal" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="17" rx="3"/><path d="M8 2.5v4M16 2.5v4M3 10h18"/></symbol>
  <symbol id="arrow" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></symbol>
  <symbol id="chat" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-5A8 8 0 1 1 21 12Z"/></symbol>
  <symbol id="phone" viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2Z"/></symbol>
  <symbol id="home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1.5 1.5 0 0 1-1.5 1.5H15v-6H9v6H4.5A1.5 1.5 0 0 1 3 20Z"/></symbol>
  <symbol id="list" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h8M8 16h5"/></symbol>
  <symbol id="user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
  <symbol id="verified" viewBox="0 0 24 24"><path fill="#16A765" d="M12 1.5l2.6 1.9 3.2-.1 1 3 2.6 1.9-1 3.1 1 3.1-2.6 1.9-1 3-3.2-.1L12 22.5l-2.6-1.9-3.2.1-1-3-2.6-1.9 1-3.1-1-3.1 2.6-1.9 1-3 3.2.1Z"/><path d="m8 12.2 2.7 2.6L16 9.5" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</defs></svg>
</body>
</html>
